[SwitchballPhysXPPU]
; folder (inside the game folder) with the PhysX 2.8.4 runtime:
; PhysXCore.dll, PhysXCooking.dll, PhysXDevice.dll, cudart32_30_9.dll, physxcudart_20.dll
CoreFolder=PhysX284

; 1 = moving bodies are pushed by cloth with NX_CLF_COLLISION_TWOWAY (as in 2.5)
ClothTwoWay=1

; 1 = creating a joint does not wake up sleeping bodies (2.5 behaviour)
JointKeepSleep=1
; 1 = log D6 joint creation, limit points and planes (diagnostics)
LogJoints=0

; 1 = log the trajectory of compound bodies (>= 10 shapes) for 40 s after a scene starts
TrackActors=0

; -1 = joint projection as the game sets it; 0 = no projection, 1 = point, 2 = linear
JointProjectionMode=-1

; diagnostics: log every moving body inside this box (xmin ymin zmin xmax ymax zmax),
; every 5th frame for 2 s, then every 30th up to 10 s. Read by BOTH builds
; (translator and the 2.5 inventory build). Empty = compound bodies only.
; Box below = the 4 crates and their ropes on level 2-4.
TrackBox=

; diagnostics: multiply all static/dynamic friction (1.0 = as the game sets it)
FrictionScale=1.0
; 1 = NX_AF_FORCE_CONE_FRICTION on every actor (friction closer to older SDKs)
ConeFriction=0
; box pushing tuning (stutter / stick-slip):
; extra multiplier for STATIC friction only (1.0 = as the game sets it; e.g. 0.8 brings
; static closer to dynamic friction, which reduces stick-slip stutter)
StaticFrictionScale=1.0
; global contact skin width; -1 = as the game sets it (0.001). 2.8 default is 0.025;
; e.g. 0.01 can stop contacts flickering on boxes
SkinWidth=-1
; minimum solver iterations for moving bodies (0 = as the game sets it; e.g. 8)
BodySolverIterations=0

; diagnostics / fixes for the 2-4 crates on ropes:
; NX_ADAPTIVE_FORCE (2.8 mass-scaling trick for stacks); -1 = 2.8 default, 0 = off
AdaptiveForce=-1
; joint solver extrapolation 0.5..2.0 (2.8 only; 1.0 = default)
JointExtrapolation=1.0
; mass multiplier for heavy compound bodies hanging on light rope links (1.0 = off)
RopeLoadMassScale=1.0

; 2-4 crates on ropes: for this many seconds after rope loads are created (level load,
; puzzle reset) the scene runs with NX_ADAPTIVE_FORCE = RopeSettleAdaptiveForce; then
; the 2.8 default comes back (cloth needs it). 0 = off
RopeSettleSeconds=10
RopeSettleAdaptiveForce=0

; cloth -> body push (two-way): multiplier of the level's collisionResponseCoefficient
; (1.0 = as the game sets it). Lower = the cloth throws the ball less.
ClothResponseScale=0.5
; multiplier of the cloth solver iterations (higher = stiffer, calmer cloth, slower)
ClothIterationScale=3
; lower limit for the cloth stretching stiffness (0..1; 0 = as the level sets it)
ClothStretchingMin=0

; 1 = emulate a PhysX PPU: the game enables its hardware levels and fluids;
;     hardware scenes and fluids run on the PhysX 2.8.4 software solver
HardwareMode=1
